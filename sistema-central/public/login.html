<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Iniciar sesión · Panel de entradas</title>
  <link rel="icon" type="image/png" href="/admin/brands/espressivo-venezuela.png?v=2" />
  <style>
    :root {
      --ink: #1d232c;
      --muted: #596472;
      --line: #dfe4eb;
      --paper: #f3f4f8;
      --accent: #075dc4;
      --wine: #681b2a;
      --purple: #5b21d6;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .login {
      width: min(400px, 100%);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .mark {
      width: 52px;
      height: 52px;
      display: block;
      padding: 4px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
    }
    .brand strong {
      display: block;
      font-size: 15px;
    }
    .brand span {
      font-size: 12px;
      color: var(--muted);
    }
    .card {
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(39, 35, 49, 0.08);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.01em;
    }
    .lead {
      margin: 0 0 22px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }
    .field {
      position: relative;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d8d3db;
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }
    input:focus {
      border-color: transparent;
      outline: 2px solid var(--accent);
      outline-offset: 0;
    }
    #password {
      padding-right: 88px;
    }
    .toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      padding: 6px 8px;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit {
      width: 100%;
      margin-top: 4px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .submit:hover {
      background: #004d9f;
    }
    .submit:disabled {
      opacity: 0.6;
      cursor: progress;
    }
    .error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fdecec;
      color: #a12a2a;
      font-size: 13px;
      line-height: 1.5;
    }
    .error[hidden] {
      display: none;
    }
    .sites {
      display: grid;
      gap: 8px;
      margin-top: 24px;
      font-size: 13px;
    }
    .sites p {
      margin: 0 0 2px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sites a {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      text-decoration: none;
    }
    .sites a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.caminos {
      background: var(--wine);
    }
    .dot.marketing {
      background: var(--purple);
    }
    :focus-visible {
      outline: 3px solid #3e83d9;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <img class="mark" src="/admin/brands/espressivo-venezuela.png?v=2" width="52" height="52" alt="Espressivo Venezuela" />
      <div><strong>Entradas</strong><span>Administración del evento</span></div>
    </div>

    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="lead">Un solo panel para las 250 entradas que se venden en Iluminando Caminos y Hablemos de Marketing.</p>
      <p id="login-error" class="error" role="alert" hidden></p>
      <form id="login-form" method="post" action="/admin/login">
        <label for="username">Usuario o correo</label>
        <div class="field">
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
        </div>
        <label for="password">Contraseña</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="button" id="toggle-password" class="toggle" aria-controls="password" aria-pressed="false">Mostrar</button>
        </div>
        <button type="submit" id="login-submit" class="submit">Entrar</button>
      </form>
    </div>

    <nav class="sites" aria-label="Webs conectadas">
      <p>Webs conectadas</p>
      <a href="https://iluminandocaminos.com" target="_blank" rel="noopener"><i class="dot caminos" aria-hidden="true"></i>Iluminando Caminos ↗</a>
      <a href="https://hablemosdemarketingmaturin.com" target="_blank" rel="noopener"><i class="dot marketing" aria-hidden="true"></i>Hablemos de Marketing ↗</a>
    </nav>
  </main>

  <script>
    (function () {
      const form = document.getElementById('login-form');
      const error = document.getElementById('login-error');
      const submit = document.getElementById('login-submit');
      const password = document.getElementById('password');
      const toggle = document.getElementById('toggle-password');

      toggle.addEventListener('click', () => {
        const show = password.type === 'password';
        password.type = show ? 'text' : 'password';
        toggle.textContent = show ? 'Ocultar' : 'Mostrar';
        toggle.setAttribute('aria-pressed', String(show));
        password.focus();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;
        submit.disabled = true;
        submit.textContent = 'Entrando…';
        try {
          const res = await fetch('/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: form.username.value,
              password: password.value,
              next: new URLSearchParams(location.search).get('next') || ''
            })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.message || 'No se pudo iniciar sesión.');
          location.replace(data.next);
        } catch (err) {
          error.textContent = err instanceof SyntaxError ? 'No se pudo conectar con el servidor. Inténtalo de nuevo.' : err.message;
          error.hidden = false;
          password.select();
          submit.disabled = false;
          submit.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
